<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#e8eff5" id="metaThemeColor">

<!-- Native App Experience Meta Tags -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lecture Binder">
<meta name="mobile-web-app-capable" content="yes">

<title>Lecture Binder — HSC 2nd Paper</title>

<script>
  (function(){
    try {
      var stored = localStorage.getItem("lecture_binder_theme");
      var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      if (theme === "dark") document.documentElement.setAttribute("data-theme", "dark");
    } catch(e) {}
  })();
</script>

<!-- PWA Manifest & App Icons -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">

<!-- Preserves exact font URL cached in sw.js -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    /* Liquid Glass - Light Mode Palette */
    --bg-base: #e8eff5;
    --glass-bg: rgba(255, 255, 255, 0.52);
    --glass-bg-hover: rgba(255, 255, 255, 0.72);
    --glass-bg-elevated: rgba(255, 255, 255, 0.82);
    --glass-sub: rgba(255, 255, 255, 0.38);
    
    /* Specular Rim Borders & Shadows */
    --glass-border: rgba(255, 255, 255, 0.75);
    --glass-border-subtle: rgba(15, 23, 42, 0.07);
    --glass-specular: inset 0 1px 1px 0 rgba(255, 255, 255, 0.9), inset 0 -1px 1px 0 rgba(255, 255, 255, 0.25);
    --glass-shadow: 0 12px 32px -8px rgba(15, 23, 42, 0.08), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
    --glass-shadow-lg: 0 24px 48px -12px rgba(15, 23, 42, 0.16), 0 4px 12px -2px rgba(15, 23, 42, 0.06);
    --glass-blur: blur(28px) saturate(190%);

    /* Typography Colors */
    --ink: #0f172a;
    --ink-secondary: #475569;
    --muted: #64748b;

    /* Subject Accents - Physics (Oceanic Teal/Cyan) */
    --physics: #0284c7;
    --physics-glow: rgba(2, 132, 199, 0.22);
    --physics-tint: rgba(2, 132, 199, 0.12);
    --physics-orb-1: rgba(56, 189, 248, 0.45);
    --physics-orb-2: rgba(20, 184, 166, 0.35);
    --physics-orb-3: rgba(99, 102, 241, 0.25);

    /* Subject Accents - Higher Math (Warm Amber/Gold) */
    --math: #d97706;
    --math-glow: rgba(217, 119, 6, 0.22);
    --math-tint: rgba(217, 119, 6, 0.12);
    --math-orb-1: rgba(251, 191, 36, 0.45);
    --math-orb-2: rgba(249, 115, 22, 0.32);
    --math-orb-3: rgba(236, 72, 153, 0.22);

    /* Dynamic Active Subject Variables */
    --accent: var(--physics);
    --accent-glow: var(--physics-glow);
    --accent-tint: var(--physics-tint);
    --orb-1: var(--physics-orb-1);
    --orb-2: var(--physics-orb-2);
    --orb-3: var(--physics-orb-3);

    --modal-backdrop: rgba(15, 23, 42, 0.35);
    --spring: cubic-bezier(0.22, 1, 0.36, 1);
  }

  html[data-theme="dark"] {
    /* Liquid Glass - Dark Mode Palette */
    --bg-base: #070b12;
    --glass-bg: rgba(22, 30, 46, 0.55);
    --glass-bg-hover: rgba(32, 43, 64, 0.68);
    --glass-bg-elevated: rgba(30, 41, 59, 0.85);
    --glass-sub: rgba(15, 23, 42, 0.45);

    --glass-border: rgba(255, 255, 255, 0.14);
    --glass-border-subtle: rgba(255, 255, 255, 0.07);
    --glass-specular: inset 0 1px 0.5px 0 rgba(255, 255, 255, 0.22), inset 0 -1px 0.5px 0 rgba(255, 255, 255, 0.04);
    --glass-shadow: 0 14px 36px -8px rgba(0, 0, 0, 0.5), 0 2px 8px 0 rgba(0, 0, 0, 0.3);
    --glass-shadow-lg: 0 28px 60px -12px rgba(0, 0, 0, 0.75);

    --ink: #f8fafc;
    --ink-secondary: #cbd5e1;
    --muted: #94a3b8;

    --physics: #38bdf8;
    --physics-glow: rgba(56, 189, 248, 0.25);
    --physics-tint: rgba(56, 189, 248, 0.15);
    --physics-orb-1: rgba(14, 165, 233, 0.28);
    --physics-orb-2: rgba(13, 148, 136, 0.24);
    --physics-orb-3: rgba(79, 70, 229, 0.22);

    --math: #fbbf24;
    --math-glow: rgba(251, 191, 36, 0.25);
    --math-tint: rgba(251, 191, 36, 0.15);
    --math-orb-1: rgba(245, 158, 11, 0.26);
    --math-orb-2: rgba(234, 88, 12, 0.22);
    --math-orb-3: rgba(219, 39, 119, 0.18);

    --modal-backdrop: rgba(2, 6, 23, 0.68);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    -webkit-text-size-adjust: 100%;
    scroll-behavior: smooth;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    min-height: 100vh;
    background-color: var(--bg-base);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "IBM Plex Sans", "Noto Sans Bengali", sans-serif;
    line-height: 1.5;
    overflow-x: hidden;
    transition: background-color 0.5s ease, color 0.3s ease;
  }

  .bn {
    font-family: "Noto Sans Bengali", "Noto Serif Bengali", sans-serif;
  }
  .bn-serif {
    font-family: "Noto Serif Bengali", "Noto Sans Bengali", serif;
  }
  .mono {
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;
    letter-spacing: 0.02em;
  }

  /* Ambient Liquid Mesh Background */
  .ambient-canvas {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
  }

  .ambient-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    transition: background 0.8s var(--spring), transform 1.2s var(--spring);
    will-change: transform, background;
  }

  .orb-1 {
    width: 520px;
    height: 520px;
    top: -140px;
    left: -100px;
    background: var(--orb-1);
    animation: floatOrb1 18s ease-in-out infinite alternate;
  }

  .orb-2 {
    width: 460px;
    height: 460px;
    top: 25%;
    right: -120px;
    background: var(--orb-2);
    animation: floatOrb2 22s ease-in-out infinite alternate;
  }

  .orb-3 {
    width: 550px;
    height: 550px;
    bottom: -180px;
    left: 20%;
    background: var(--orb-3);
    animation: floatOrb3 20s ease-in-out infinite alternate;
  }

  @keyframes floatOrb1 {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(80px, 60px) scale(1.12); }
  }
  @keyframes floatOrb2 {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(-70px, 90px) scale(1.08); }
  }
  @keyframes floatOrb3 {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(60px, -70px) scale(1.15); }
  }

  /* Main Layout Container */
  .wrap {
    max-width: 860px;
    margin: 0 auto;
    padding: 20px 20px 96px;
  }

  /* Floating Liquid Glass Navbar */
  header.site-header {
    position: sticky;
    top: 16px;
    z-index: 40;
    margin-bottom: 28px;
  }

  .glass-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 18px;
    background: var(--glass-bg);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border: 1px solid var(--glass-border);
    border-radius: 999px;
    box-shadow: var(--glass-shadow), var(--glass-specular);
    transition: background 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
  }

  .brand-group {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
  }

  .site-logo {
    width: 42px;
    height: 42px;
    border-radius: 14px;
    flex-shrink: 0;
    box-shadow: 0 4px 12px var(--accent-glow);
    transition: transform 0.3s var(--spring), box-shadow 0.3s ease;
  }
  .site-logo:hover {
    transform: scale(1.06) rotate(-2deg);
  }

  .brand-titles {
    min-width: 0;
  }

  .eyebrow-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .eyebrow {
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  h1.site-title {
    font-size: clamp(1.2rem, 3vw, 1.45rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .nav-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .credit-pill {
    font-size: 0.72rem;
    color: var(--ink-secondary);
    background: var(--glass-sub);
    border: 1px solid var(--glass-border);
    padding: 6px 12px;
    border-radius: 999px;
    box-shadow: var(--glass-specular);
    white-space: nowrap;
  }

  /* Liquid Glass Theme Button */
  .theme-toggle {
    position: relative;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--glass-border);
    background: var(--glass-bg-elevated);
    box-shadow: var(--glass-specular), 0 4px 10px rgba(0, 0, 0, 0.06);
    cursor: pointer;
    display: grid;
    place-items: center;
    overflow: hidden;
    color: var(--ink);
    transition: transform 0.2s var(--spring), border-color 0.25s ease, background 0.25s ease;
  }
  .theme-toggle:hover {
    transform: scale(1.06);
    border-color: var(--accent);
  }
  .theme-toggle:active {
    transform: scale(0.92);
  }
  .theme-toggle svg {
    position: absolute;
    width: 19px;
    height: 19px;
    transition: transform 0.5s var(--spring), opacity 0.3s ease;
  }
  .theme-toggle .icon-sun { color: var(--math); }
  .theme-toggle .icon-moon { color: var(--physics); }

  html:not([data-theme="dark"]) .theme-toggle .icon-sun { opacity: 1; transform: rotate(0deg) scale(1); }
  html:not([data-theme="dark"]) .theme-toggle .icon-moon { opacity: 0; transform: rotate(90deg) scale(0.4); }
  html[data-theme="dark"] .theme-toggle .icon-sun { opacity: 0; transform: rotate(-90deg) scale(0.4); }
  html[data-theme="dark"] .theme-toggle .icon-moon { opacity: 1; transform: rotate(0deg) scale(1); }

  /* Liquid Glass Subject Switcher */
  nav.subjects {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 20px;
  }

  .subject-tab {
    position: relative;
    cursor: pointer;
    text-align: left;
    padding: 18px 20px;
    border-radius: 24px;
    background: var(--glass-bg);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow), var(--glass-specular);
    transition: transform 0.28s var(--spring), background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    overflow: hidden;
  }

  .subject-tab::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at top right, var(--accent-glow), transparent 70%);
    opacity: 0;
    transition: opacity 0.35s ease;
    pointer-events: none;
  }

  .subject-tab:hover {
    transform: translateY(-2px);
    background: var(--glass-bg-hover);
  }

  .subject-tab[aria-selected="true"] {
    background: var(--glass-bg-elevated);
    border-color: var(--accent);
    box-shadow: 0 16px 36px -8px var(--accent-glow), var(--glass-specular);
    transform: translateY(-2px);
  }

  .subject-tab[aria-selected="true"]::before {
    opacity: 1;
  }

  .subject-tab-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 4px;
  }

  .subject-tab .name-bn {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--ink);
    transition: color 0.25s ease;
  }

  .subject-tab[aria-selected="true"] .name-bn {
    color: var(--accent);
  }

  .subject-tab .name-en {
    display: block;
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--ink-secondary);
  }

  .subject-tab .count-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 12px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 0.73rem;
    font-weight: 500;
    color: var(--ink-secondary);
    background: var(--glass-sub);
    border: 1px solid var(--glass-border-subtle);
  }

  .count-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
  }
  .subject-tab[data-subject="physics"] .count-dot {
    background: var(--physics);
    box-shadow: 0 0 8px var(--physics);
  }
  .subject-tab[data-subject="math"] .count-dot {
    background: var(--math);
    box-shadow: 0 0 8px var(--math);
  }

  /* Search & Filter Bar */
  .toolbar {
    display: flex;
    gap: 12px;
    margin-bottom: 22px;
    align-items: stretch;
  }

  .search-box {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
  }

  .search-icon {
    position: absolute;
    left: 16px;
    width: 18px;
    height: 18px;
    color: var(--muted);
    pointer-events: none;
  }

  .search-input {
    width: 100%;
    padding: 13px 42px 13px 44px;
    border-radius: 18px;
    background: var(--glass-bg);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow), var(--glass-specular);
    color: var(--ink);
    font: inherit;
    font-size: 0.92rem;
    transition: border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
  }

  .search-input::placeholder {
    color: var(--muted);
  }

  .search-input:focus {
    outline: none;
    background: var(--glass-bg-elevated);
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-tint), var(--glass-specular);
  }

  .kbd-hint {
    position: absolute;
    right: 14px;
    font-size: 0.7rem;
    color: var(--muted);
    background: var(--glass-sub);
    border: 1px solid var(--glass-border);
    border-radius: 6px;
    padding: 2px 7px;
    pointer-events: none;
  }

  .filter-pill {
    cursor: pointer;
    padding: 0 16px;
    border-radius: 18px;
    background: var(--glass-bg);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow), var(--glass-specular);
    color: var(--ink-secondary);
    font-size: 0.82rem;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    transition: all 0.25s var(--spring);
  }

  .filter-pill:hover {
    background: var(--glass-bg-hover);
    color: var(--ink);
  }

  .filter-pill[aria-pressed="true"] {
    background: var(--accent-tint);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Chapter List & Liquid Glass Cards */
  main.panel {
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 240px;
  }

  details.chapter {
    background: var(--glass-bg);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    box-shadow: var(--glass-shadow), var(--glass-specular);
    overflow: hidden;
    transition: transform 0.25s var(--spring), background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
  }

  details.chapter:hover {
    background: var(--glass-bg-hover);
  }

  details.chapter[open] {
    background: var(--glass-bg-elevated);
    border-color: var(--accent);
    box-shadow: 0 18px 40px -12px var(--accent-glow), var(--glass-specular);
  }

  summary.chapter-head {
    list-style: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    user-select: none;
  }
  summary.chapter-head::-webkit-details-marker {
    display: none;
  }

  .chapter-code {
    flex: 0 0 auto;
    font-size: 0.74rem;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-tint);
    border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    padding: 6px 10px;
    border-radius: 12px;
    min-width: 58px;
    text-align: center;
    box-shadow: var(--glass-specular);
  }

  .chapter-titles {
    flex: 1 1 auto;
    min-width: 0;
  }

  .chapter-name-bn {
    font-size: 1.08rem;
    font-weight: 600;
    color: var(--ink);
    display: block;
    line-height: 1.35;
  }

  .chapter-name-en {
    font-size: 0.8rem;
    color: var(--ink-secondary);
    display: block;
    margin-top: 2px;
  }

  .chapter-meta {
    flex: 0 0 auto;
    font-size: 0.74rem;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--glass-sub);
    border: 1px solid var(--glass-border-subtle);
    color: var(--ink-secondary);
    white-space: nowrap;
  }

  .chapter-meta.has-sheets {
    color: var(--accent);
    background: var(--accent-tint);
    border-color: color-mix(in srgb, var(--accent) 25%, transparent);
  }

  .chapter-chevron {
    flex: 0 0 auto;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--glass-sub);
    border: 1px solid var(--glass-border-subtle);
    display: grid;
    place-items: center;
    color: var(--ink-secondary);
    transition: transform 0.3s var(--spring), background 0.25s ease, color 0.25s ease;
  }

  details[open] .chapter-chevron {
    transform: rotate(90deg);
    background: var(--accent);
    color: #fff;
    border-color: transparent;
  }

  .chapter-body {
    padding: 4px 18px 18px;
    border-top: 1px solid var(--glass-border-subtle);
  }

  .sheet-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 12px;
  }

  .sheet-empty {
    font-size: 0.88rem;
    color: var(--muted);
    padding: 12px 8px;
    text-align: center;
  }

  .sheet-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--glass-sub);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 12px 14px;
    box-shadow: var(--glass-specular);
    transition: transform 0.2s var(--spring), border-color 0.2s ease, background 0.2s ease;
  }

  .sheet-row:hover {
    transform: scale(1.008);
    background: var(--glass-bg-hover);
    border-color: var(--accent);
  }

  .sheet-info-group {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    flex: 1;
  }

  .sheet-icon {
    flex: 0 0 auto;
    width: 38px;
    height: 38px;
    border-radius: 12px;
    background: var(--accent-tint);
    border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent);
    color: var(--accent);
    display: grid;
    place-items: center;
    font-size: 0.7rem;
    font-weight: 700;
  }

  .sheet-info {
    flex: 1 1 auto;
    min-width: 0;
  }

  .sheet-name {
    display: block;
    font-size: 0.92rem;
    font-weight: 600;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .sheet-sub {
    display: block;
    font-size: 0.74rem;
    color: var(--muted);
    margin-top: 1px;
  }

  .sheet-actions {
    display: flex;
    gap: 8px;
    flex: 0 0 auto;
  }

  .btn-read {
    background: var(--accent);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.25);
    padding: 8px 15px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 12px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: transform 0.18s var(--spring), filter 0.2s ease;
  }
  html[data-theme="dark"] .btn-read {
    color: #070b12;
  }
  .btn-read:hover {
    filter: brightness(1.08);
    transform: translateY(-1px);
  }
  .btn-read:active {
    transform: scale(0.96);
  }

  .btn-drive {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-specular);
    color: var(--ink-secondary);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 500;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
  }
  .btn-drive:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--glass-bg-elevated);
  }

  /* Spatial Liquid Glass PDF Modal */
  .pdf-modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--modal-backdrop);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .pdf-modal-backdrop.open {
    opacity: 1;
    pointer-events: auto;
  }

  .pdf-viewer-container {
    width: min(1040px, 100%);
    height: min(88vh, 860px);
    background: var(--glass-bg-elevated);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border: 1px solid var(--glass-border);
    border-radius: 26px;
    box-shadow: var(--glass-shadow-lg), var(--glass-specular);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transform: scale(0.94) translateY(20px);
    transition: transform 0.38s var(--spring), width 0.3s ease, height 0.3s ease, border-radius 0.3s ease;
  }

  .pdf-modal-backdrop.open .pdf-viewer-container {
    transform: scale(1) translateY(0);
  }

  .pdf-viewer-container.is-fullscreen {
    width: 100vw;
    height: 100vh;
    border-radius: 0;
  }

  .pdf-viewer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    background: var(--glass-sub);
    border-bottom: 1px solid var(--glass-border);
  }

  .pdf-title-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .pdf-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    flex-shrink: 0;
  }

  #viewerTitle {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .pdf-header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .pdf-ctrl-btn {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-specular);
    color: var(--ink-secondary);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all 0.2s ease;
  }
  .pdf-ctrl-btn:hover {
    background: var(--glass-bg-hover);
    color: var(--ink);
    border-color: var(--accent);
  }

  .pdf-viewer-container iframe {
    width: 100%;
    flex: 1;
    border: none;
    background: rgba(0, 0, 0, 0.03);
  }

  /* Skeleton Loading Styles */
  .skeleton-item {
    height: 68px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    box-shadow: var(--glass-specular);
    animation: skeleton-pulse 1.4s infinite ease-in-out;
  }
  @keyframes skeleton-pulse {
    0%, 100% { opacity: 0.65; }
    50% { opacity: 0.3; }
  }

  footer.note {
    margin-top: 32px;
    padding: 16px 20px;
    border-radius: 18px;
    background: var(--glass-sub);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-specular);
    font-size: 0.8rem;
    color: var(--ink-secondary);
    text-align: center;
  }

  @media (max-width: 620px) {
    .wrap {
      padding: 12px 14px 80px;
    }
    .glass-nav {
      padding: 10px 14px;
    }
    .credit-pill {
      display: none;
    }
    nav.subjects {
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .subject-tab {
      padding: 14px;
      border-radius: 20px;
    }
    .subject-tab .name-bn {
      font-size: 1.08rem;
    }
    .toolbar {
      flex-direction: column;
    }
    .filter-pill {
      padding: 11px 16px;
      justify-content: center;
    }
    .kbd-hint {
      display: none;
    }
    .chapter-meta {
      display: none;
    }
    .sheet-row {
      flex-direction: column;
      align-items: stretch;
    }
    .sheet-actions {
      width: 100%;
    }
    .btn-read, .btn-drive {
      flex: 1;
      justify-content: center;
    }
    .pdf-modal-backdrop {
      padding: 0;
      align-items: flex-end;
    }
    .pdf-viewer-container {
      width: 100%;
      height: 92vh;
      border-radius: 24px 24px 0 0;
    }
  }
</style>

<script>
(function(){
  "use strict";

  // Register Service Worker for PWA
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(err => {
        console.error('ServiceWorker registration failed: ', err);
      });
    });
  }

  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQLFwSjs3po1TpI0XSsjBeJtYf_g9j81XSAxz_L6gh6xsamgt3Zy6KXTqQvApFKHtL59mFxrlGOAsuC/pub?output=csv";
  const CACHE_KEY = "lecture_binder_data_v1";
  const CACHE_TIME_KEY = "lecture_binder_time_v1";
  const CACHE_DURATION = 10 * 60 * 1000; // 10 minutes cache

  const BASE_SYLLABUS = {
    physics: {
      label: "পদার্থবিজ্ঞান", labelEn: "Physics", prefix: "PH",
      chapters: [
        { bn: "তাপগতিবিদ্যা", en: "Thermodynamics", sheets: [] },
        { bn: "স্থির তড়িৎ", en: "Electrostatics", sheets: [] },
        { bn: "চল তড়িৎ", en: "Current Electricity", sheets: [] },
        { bn: "তড়িৎ প্রবাহের চৌম্বক ক্রিয়া ও চুম্বকত্ব", en: "Magnetic Effect of Current & Magnetism", sheets: [] },
        { bn: "তড়িৎ চুম্বকীয় আবেশ ও পরিবর্তী প্রবাহ", en: "Electromagnetic Induction & Alternating Current", sheets: [] },
        { bn: "জ্যামিতিক আলোকবিজ্ঞান", en: "Geometrical Optics", sheets: [] },
        { bn: "ভৌত আলোকবিজ্ঞান", en: "Physical Optics", sheets: [] },
        { bn: "আধুনিক পদার্থবিজ্ঞানের সূচনা", en: "Introduction to Modern Physics", sheets: [] },
        { bn: "পরমাণুর মডেল ও নিউক্লিয়ার পদার্থবিজ্ঞান", en: "Atomic Model & Nuclear Physics", sheets: [] },
        { bn: "সেমিকন্ডাক্টর ও ইলেকট্রনিক্স", en: "Semiconductor & Electronics", sheets: [] }
      ]
    },
    math: {
      label: "উচ্চতর গণিত", labelEn: "Higher Math", prefix: "HM",
      chapters: [
        { bn: "বাস্তব সংখ্যা ও অসমতা", en: "Real Numbers & Inequalities", sheets: [] },
        { bn: "যোগাশ্রয়ী প্রোগ্রাম", en: "Linear Programming", sheets: [] },
        { bn: "জটিল সংখ্যা", en: "Complex Numbers", sheets: [] },
        { bn: "বহুপদী ও বহুপদী সমীকরণ", en: "Polynomials & Polynomial Equations", sheets: [] },
        { bn: "দ্বিপদী বিস্তৃতি", en: "Binomial Expansion", sheets: [] },
        { bn: "কণিক", en: "Conics", sheets: [] },
        { bn: "বিপরীত ত্রিকোণমিতিক ফাংশন ও ত্রিকোণমিতিক সমীকরণ", en: "Inverse Trig Functions & Trig Equations", sheets: [] },
        { bn: "স্থিতিবিদ্যা", en: "Statics", sheets: [] },
        { bn: "সমতলে বস্তুকণার গতি", en: "Motion of Particles in a Plane", sheets: [] },
        { bn: "সম্ভাবনা", en: "Probability", sheets: [] }
      ]
    }
  };

  let SYLLABUS = JSON.parse(JSON.stringify(BASE_SYLLABUS));
  let activeSubject = "physics";
  let searchQuery = "";
  let filterWithSheetsOnly = false;
  let currentActivePreviewUrl = "";

  function renderSkeletons() {
    const panel = document.getElementById("panel");
    panel.innerHTML = Array(5).fill('<div class="skeleton-item"></div>').join('');
  }

  function parseCSV(text) {
    const lines = text.trim().split("\n");
    if (lines.length < 2) return [];
    const headers = lines[0].split(",").map(h => h.trim().replace(/^"|"$/g, ''));
    const results = [];

    for (let i = 1; i < lines.length; i++) {
      if (!lines[i].trim()) continue;
      const values = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.trim().replace(/^"|"$/g, ''));
      const obj = {};
      headers.forEach((h, idx) => obj[h] = values[idx] || "");
      results.push(obj);
    }
    return results;
  }

  async function loadDataFromSheets() {
    renderSkeletons();

    const cachedData = localStorage.getItem(CACHE_KEY);
    const cachedTime = localStorage.getItem(CACHE_TIME_KEY);
    const isCacheValid = cachedTime && (Date.now() - parseInt(cachedTime, 10) < CACHE_DURATION);

    if (cachedData && isCacheValid) {
      applyParsedData(JSON.parse(cachedData));
      renderPanel();
      fetchFreshData();
      return;
    }

    await fetchFreshData();
  }

  async function fetchFreshData() {
    try {
      const res = await fetch(SHEET_CSV_URL);
      const csvText = await res.text();
      const data = parseCSV(csvText);

      localStorage.setItem(CACHE_KEY, JSON.stringify(data));
      localStorage.setItem(CACHE_TIME_KEY, Date.now().toString());

      applyParsedData(data);
    } catch (e) {
      console.error("Failed to load Google Sheets data", e);
    } finally {
      renderPanel();
    }
  }

  function applyParsedData(data) {
    SYLLABUS = JSON.parse(JSON.stringify(BASE_SYLLABUS));
    data.forEach(row => {
      const subj = row.Subject ? row.Subject.toLowerCase().trim() : "";
      const chIdx = parseInt(row.ChapterIndex, 10) - 1;

      if (SYLLABUS[subj] && SYLLABUS[subj].chapters[chIdx]) {
        SYLLABUS[subj].chapters[chIdx].sheets.push({
          title: row.Title,
          driveUrl: row.DriveUrl
        });
      }
    });
  }

  function getPreviewUrl(rawUrl) {
    if (!rawUrl) return "";
    let cleanUrl = rawUrl;
    const match = rawUrl.match(/https?:\/\/[^\s\)\>\]]+/);
    if (match) {
      cleanUrl = match[0];
    }
    if (cleanUrl.includes('/view')) {
      return cleanUrl.replace(/\/view.*$/, '/preview');
    }
    return cleanUrl;
  }

  function updateTabCounts() {
    document.querySelectorAll(".subject-tab").forEach(tab => {
      const subj = tab.dataset.subject;
      const totalCh = SYLLABUS[subj].chapters.length;
      let sheetTotal = 0;
      SYLLABUS[subj].chapters.forEach(c => { sheetTotal += c.sheets.length; });
      const label = sheetTotal > 0
        ? totalCh + " chapters · " + sheetTotal + " sheet" + (sheetTotal === 1 ? "" : "s")
        : totalCh + " chapters";
      tab.querySelector('[data-role="count"]').textContent = label;
    });
  }

  function syncSubjectThemeVars() {
    const root = document.documentElement;
    root.style.setProperty("--accent", `var(--${activeSubject})`);
    root.style.setProperty("--accent-glow", `var(--${activeSubject}-glow)`);
    root.style.setProperty("--accent-tint", `var(--${activeSubject}-tint)`);
    root.style.setProperty("--orb-1", `var(--${activeSubject}-orb-1)`);
    root.style.setProperty("--orb-2", `var(--${activeSubject}-orb-2)`);
    root.style.setProperty("--orb-3", `var(--${activeSubject}-orb-3)`);
  }

  function renderPanel() {
    document.body.className = "subject-" + activeSubject;
    syncSubjectThemeVars();

    const subj = SYLLABUS[activeSubject];
    const panel = document.getElementById("panel");
    panel.innerHTML = "";

    const q = searchQuery.toLowerCase();
    const fragment = document.createDocumentFragment();
    let visibleCount = 0;

    subj.chapters.forEach((ch, idx) => {
      const code = subj.prefix + "-" + String(idx + 1).padStart(2, "0");
      const matchingSheets = ch.sheets.filter(s => s.title.toLowerCase().includes(q));
      const chapterMatches =
        ch.bn.toLowerCase().includes(q) ||
        ch.en.toLowerCase().includes(q) ||
        code.toLowerCase().includes(q);

      if (filterWithSheetsOnly && ch.sheets.length === 0) return;
      if (q && !chapterMatches && matchingSheets.length === 0) return;

      visibleCount++;
      const sheetsToDisplay = (q && !chapterMatches) ? matchingSheets : ch.sheets;
      const sheetCount = sheetsToDisplay.length;

      const details = document.createElement("details");
      details.className = "chapter";
      if (q) details.open = true;

      const summary = document.createElement("summary");
      summary.className = "chapter-head";
      summary.innerHTML = `
        <span class="chapter-code mono">${code}</span>
        <span class="chapter-titles">
          <span class="chapter-name-bn bn-serif">${ch.bn}</span>
          <span class="chapter-name-en">${ch.en}</span>
        </span>
        <span class="chapter-meta mono ${sheetCount > 0 ? 'has-sheets' : ''}">
          ${sheetCount > 0 ? sheetCount + " sheet" + (sheetCount === 1 ? "" : "s") : "empty"}
        </span>
        <span class="chapter-chevron">›</span>
      `;
      details.appendChild(summary);

      const body = document.createElement("div");
      body.className = "chapter-body";

      const list = document.createElement("div");
      list.className = "sheet-list";

      if (sheetCount === 0) {
        list.innerHTML = `<div class="sheet-empty bn">এখনও কোনো লেকচার শীট নেই।</div>`;
      } else {
        sheetsToDisplay.forEach(s => {
          const previewUrl = getPreviewUrl(s.driveUrl);
          const row = document.createElement("div");
          row.className = "sheet-row";

          const infoGroup = document.createElement("div");
          infoGroup.className = "sheet-info-group";

          const icon = document.createElement("span");
          icon.className = "sheet-icon mono";
          icon.textContent = "PDF";

          const info = document.createElement("span");
          info.className = "sheet-info";

          const nameSpan = document.createElement("span");
          nameSpan.className = "sheet-name bn";
          nameSpan.textContent = s.title;

          const subSpan = document.createElement("span");
          subSpan.className = "sheet-sub";
          subSpan.textContent = "Google Drive Document";

          info.appendChild(nameSpan);
          info.appendChild(subSpan);
          infoGroup.appendChild(icon);
          infoGroup.appendChild(info);

          const actions = document.createElement("div");
          actions.className = "sheet-actions";

          const readBtn = document.createElement("button");
          readBtn.type = "button";
          readBtn.className = "btn-read";
          readBtn.textContent = "Read PDF";
          readBtn.addEventListener("click", () => openPdfViewer(previewUrl, s.title, s.driveUrl));

          const driveLink = document.createElement("a");
          driveLink.href = s.driveUrl;
          driveLink.target = "_blank";
          driveLink.rel = "noopener";
          driveLink.className = "btn-drive";
          driveLink.textContent = "Open Drive";

          actions.appendChild(readBtn);
          actions.appendChild(driveLink);

          row.appendChild(infoGroup);
          row.appendChild(actions);
          list.appendChild(row);
        });
      }

      body.appendChild(list);
      details.appendChild(body);
      fragment.appendChild(details);
    });

    if (visibleCount === 0) {
      panel.innerHTML = `<div class="sheet-empty bn" style="padding: 36px 16px;">কোনো অধ্যায় বা লেকচার শীট খুঁজে পাওয়া যায়নি।</div>`;
    } else {
      panel.appendChild(fragment);
    }

    updateTabCounts();
  }

  // Modal PDF Viewer Controls
  const viewerModal = document.getElementById("viewerModal");
  const viewerContainer = document.getElementById("viewerContainer");
  const frame = document.getElementById("pdfFrame");
  const viewerTitle = document.getElementById("viewerTitle");
  const modalDriveBtn = document.getElementById("modalDriveBtn");
  const fullscreenBtn = document.getElementById("fullscreenViewerBtn");

  function openPdfViewer(previewUrl, title, rawDriveUrl) {
    if (viewerModal.classList.contains("open") && currentActivePreviewUrl === previewUrl) {
      closePdfViewer();
      return;
    }
    currentActivePreviewUrl = previewUrl;
    frame.src = previewUrl;
    viewerTitle.textContent = title ? title : "PDF Preview";
    modalDriveBtn.href = rawDriveUrl || previewUrl;
    viewerModal.classList.add("open");
    document.body.style.overflow = "hidden";
  }

  function closePdfViewer() {
    viewerModal.classList.remove("open");
    viewerContainer.classList.remove("is-fullscreen");
    fullscreenBtn.textContent = "Fullscreen";
    document.body.style.overflow = "";
    setTimeout(() => {
      frame.src = "";
      currentActivePreviewUrl = "";
    }, 280);
  }

  document.getElementById("closeViewerBtn").addEventListener("click", closePdfViewer);

  fullscreenBtn.addEventListener("click", () => {
    const isFull = viewerContainer.classList.toggle("is-fullscreen");
    fullscreenBtn.textContent = isFull ? "Exit Fullscreen" : "Fullscreen";
  });

  viewerModal.addEventListener("click", (e) => {
    if (e.target === viewerModal) closePdfViewer();
  });

  // Search & Filter Events
  const searchInput = document.getElementById("searchInput");
  const filterAvailableBtn = document.getElementById("filterAvailableBtn");

  searchInput.addEventListener("input", (e) => {
    searchQuery = e.target.value.trim();
    renderPanel();
  });

  filterAvailableBtn.addEventListener("click", () => {
    filterWithSheetsOnly = !filterWithSheetsOnly;
    filterAvailableBtn.setAttribute("aria-pressed", filterWithSheetsOnly ? "true" : "false");
    renderPanel();
  });

  window.addEventListener("keydown", (e) => {
    if (e.key === "/" && document.activeElement !== searchInput) {
      e.preventDefault();
      searchInput.focus();
    } else if (e.key === "Escape" && viewerModal.classList.contains("open")) {
      closePdfViewer();
    }
  });

  // Dark Mode Toggle
  const THEME_KEY = "lecture_binder_theme";
  const themeToggleBtn = document.getElementById("themeToggle");
  const metaThemeColor = document.getElementById("metaThemeColor");

  function syncMetaThemeColor() {
    if (metaThemeColor) {
      const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg-base").trim();
      metaThemeColor.setAttribute("content", bg);
    }
  }

  function applyTheme(theme) {
    if (theme === "dark") {
      document.documentElement.setAttribute("data-theme", "dark");
    } else {
      document.documentElement.removeAttribute("data-theme");
    }
    themeToggleBtn.setAttribute("aria-pressed", theme === "dark" ? "true" : "false");
    syncMetaThemeColor();
  }

  function getCurrentTheme() {
    return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
  }

  applyTheme(getCurrentTheme());

  themeToggleBtn.addEventListener("click", () => {
    const next = getCurrentTheme() === "dark" ? "light" : "dark";
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch(e) {}
  });

  // Subject Tab Switching
  document.querySelectorAll(".subject-tab").forEach(tab => {
    tab.addEventListener("click", () => {
      if (activeSubject === tab.dataset.subject) return;
      activeSubject = tab.dataset.subject;
      document.querySelectorAll(".subject-tab").forEach(t => {
        t.setAttribute("aria-selected", t === tab ? "true" : "false");
      });
      closePdfViewer();
      renderPanel();
    });
  });

  loadDataFromSheets();
})();
</script>
</body>
</html>
