<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" id="metaThemeColor">

<!-- Native App Experience Meta Tags -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lecture Binder">
<meta name="mobile-web-app-capable" content="yes">

<title>Lecture Binder — HSC 2nd Paper</title>

<script>
  (function(){
    try {
      var stored = localStorage.getItem("lecture_binder_theme");
      var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      if (theme === "dark") document.documentElement.setAttribute("data-theme", "dark");
    } catch(e) {}
  })();
</script>

<!-- PWA Manifest & App Icons -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    /* Light Theme Tokens */
    --bg-app: #f8fafc;
    --bg-surface: #ffffff;
    --bg-surface-hover: #f1f5f9;
    --border: #e2e8f0;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    --shadow-lg: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
    
    /* Subject Colors */
    --physics: #0ea5e9;
    --physics-light: #e0f2fe;
    --math: #f59e0b;
    --math-light: #fef3c7;
    
    --accent: var(--physics);
    --accent-light: var(--physics-light);
    --modal-overlay: rgba(15, 23, 42, 0.4);
  }

  html[data-theme="dark"] {
    /* Dark Theme Tokens */
    --bg-app: #0f172a;
    --bg-surface: #1e293b;
    --bg-surface-hover: #334155;
    --border: #334155;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.5);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.4);
    --shadow-lg: 0 25px 50px -12px rgb(0 0 0 / 0.5);
    
    --physics: #38bdf8;
    --physics-light: #0369a1;
    --math: #fbbf24;
    --math-light: #b45309;
    --modal-overlay: rgba(0, 0, 0, 0.7);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  html {
    scroll-behavior: smooth;
    -webkit-tap-highlight-color: transparent;
    background-color: var(--bg-app);
  }
  
  body {
    background-color: var(--bg-app);
    color: var(--text-main);
    font-family: 'Inter', 'Noto Sans Bengali', sans-serif;
    line-height: 1.5;
    min-height: 100dvh;
    padding-bottom: env(safe-area-inset-bottom);
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  .bn { font-family: 'Noto Sans Bengali', sans-serif; }
  .mono { font-family: monospace; }

  /* --- Desktop Spatial Background Doodles --- */
  .desktop-bg {
    position: fixed; inset: 0; z-index: -1;
    pointer-events: none; overflow: hidden;
    transition: opacity 0.4s ease;
  }
  
  @media (max-width: 900px) { .desktop-bg { display: none; } }
  
  @keyframes doodleFloat1 {
    0%, 100% { transform: translateY(0) rotate(var(--rot, 0deg)); }
    50% { transform: translateY(-20px) rotate(calc(var(--rot, 0deg) + 6deg)); }
  }
  @keyframes doodleFloat2 {
    0%, 100% { transform: translateY(0) rotate(var(--rot, 0deg)); }
    50% { transform: translateY(-28px) rotate(calc(var(--rot, 0deg) - 5deg)); }
  }
  @keyframes doodleFloat3 {
    0%, 100% { transform: translateX(0) rotate(var(--rot, 0deg)); }
    50% { transform: translateX(15px) rotate(calc(var(--rot, 0deg) + 4deg)); }
  }

  .bg-doodle {
    position: absolute;
    font-family: 'Inter', serif;
    font-weight: 700;
    display: flex; justify-content: center; align-items: center;
    color: var(--text-main);
    white-space: nowrap;
    opacity: 0;
    animation-fill-mode: both;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
    transition: opacity 0.6s ease;
  }
  .desktop-bg.ready .bg-doodle { opacity: var(--doodle-opacity, 0.10); }
  html[data-theme="dark"] .desktop-bg.ready .bg-doodle { opacity: calc(var(--doodle-opacity, 0.10) * 0.6); }

  .bg-doodle svg { width: 1em; height: 1em; stroke-width: 1.5; fill: none; stroke: currentColor; }
  .bg-doodle.accent { color: var(--accent); }
  .bg-doodle.formula { font-family: 'Georgia', 'Times New Roman', serif; font-style: italic; letter-spacing: 0.02em; }

  /* --- Positions generated via JS, these are fallback layout helpers --- */

  /* Spatial Floating Top Bar & Credits */
  .top-meta-bar {
    max-width: 800px;
    margin: 16px auto 12px;
    padding: 0 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.75rem;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-weight: 600;
  }
  
  .navbar-wrapper {
    position: sticky;
    top: 12px;
    z-index: 40;
    padding: 0 16px;
  }

  .navbar {
    background: color-mix(in srgb, var(--bg-surface) 85%, transparent);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 12px 20px;
    box-shadow: var(--shadow-sm);
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: all 0.3s ease;
  }

  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-icon {
    width: 38px; height: 38px;
    background: var(--accent);
    border-radius: 10px;
    display: grid; place-items: center;
    color: #fff;
    box-shadow: var(--shadow-sm);
    transition: background-color 0.3s ease;
  }
  .brand-title {
    font-size: 1.25rem; font-weight: 700;
    letter-spacing: -0.02em;
  }
  .brand-subtitle {
    font-size: 0.75rem; color: var(--text-muted);
    font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase;
  }

  .header-actions { display: flex; align-items: center; gap: 16px; }

  /* Theme Toggle */
  .theme-toggle {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    color: var(--text-main);
    width: 40px; height: 40px;
    border-radius: 50%;
    cursor: pointer;
    position: relative;
    display: flex; justify-content: center; align-items: center;
    transition: all 0.2s ease;
    overflow: hidden;
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
  
  .theme-toggle svg { 
    position: absolute;
    width: 18px; height: 18px; 
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease; 
  }
  
  html:not([data-theme="dark"]) .icon-sun { opacity: 1; transform: rotate(0deg) scale(1); pointer-events: auto; }
  html:not([data-theme="dark"]) .icon-moon { opacity: 0; transform: rotate(90deg) scale(0.5); pointer-events: none; }
  html[data-theme="dark"] .icon-sun { opacity: 0; transform: rotate(-90deg) scale(0.5); pointer-events: none; }
  html[data-theme="dark"] .icon-moon { opacity: 1; transform: rotate(0deg) scale(1); pointer-events: auto; }

  /* Main Container */
  .container {
    max-width: 800px;
    margin: 0 auto;
    padding: 24px 24px 100px;
  }

  /* Segmented Controls (Subject Switcher) */
  .subject-switcher {
    display: flex;
    background: var(--border);
    padding: 4px;
    border-radius: 12px;
    margin-bottom: 24px;
  }
  .subject-tab {
    flex: 1;
    background: transparent;
    border: none;
    padding: 10px;
    border-radius: 8px;
    font-size: 0.95rem; font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.25s ease;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .subject-tab span.en-label { font-size: 0.7rem; font-weight: 500; opacity: 0.8; }
  
  .subject-tab[aria-selected="true"] {
    background: var(--bg-surface);
    color: var(--accent);
    box-shadow: var(--shadow-sm);
  }

  /* Search & Filter Controls */
  .controls-row {
    display: flex; gap: 12px;
    margin-bottom: 32px;
    align-items: stretch;
  }
  .search-container {
    position: relative;
    flex: 1;
  }
  .search-icon {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    color: var(--text-muted); width: 18px; height: 18px;
  }
  .search-input {
    width: 100%; height: 100%;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    padding: 14px 16px 14px 44px;
    border-radius: 12px;
    font-size: 0.95rem;
    color: var(--text-main);
    box-shadow: var(--shadow-sm);
    transition: all 0.2s ease;
    font-family: inherit;
  }
  .search-input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-light);
  }

  /* Filter Pill */
  .filter-pill {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 0 16px; border-radius: 12px;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-weight: 600; font-size: 0.9rem;
    cursor: pointer; transition: all 0.2s;
    box-shadow: var(--shadow-sm);
    white-space: nowrap;
  }
  .filter-pill:hover { border-color: var(--accent); color: var(--accent); }
  .filter-pill.active { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }

  /* Chapters Grid */
  .chapters-container { display: flex; flex-direction: column; gap: 16px; }

  details.chapter-card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    transition: box-shadow 0.2s ease, border-color 0.2s ease;
  }
  details.chapter-card[open] { border-color: var(--accent); box-shadow: var(--shadow-md); }

  summary.chapter-header {
    padding: 18px 20px;
    display: flex; align-items: center; gap: 16px;
    cursor: pointer; list-style: none;
    background: var(--bg-surface);
  }
  summary.chapter-header::-webkit-details-marker { display: none; }
  summary.chapter-header:hover { background: var(--bg-surface-hover); }

  .chapter-number {
    background: var(--accent-light);
    color: var(--accent);
    font-size: 0.8rem; font-weight: 700;
    padding: 6px 10px; border-radius: 8px;
  }
  .chapter-title-group { flex: 1; }
  .chapter-title-bn { font-size: 1.1rem; font-weight: 700; display: block; }
  .chapter-title-en { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; }
  
  /* Sheet Count Badge */
  .sheet-count {
    font-size: 0.75rem; font-weight: 600;
    background: var(--border); color: var(--text-muted);
    padding: 4px 8px; border-radius: 6px;
    white-space: nowrap;
  }

  .chapter-chevron {
    width: 20px; height: 20px; color: var(--text-muted);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  details[open] .chapter-chevron { transform: rotate(180deg); color: var(--accent); }

  .chapter-content {
    padding: 0 20px 20px;
    border-top: 1px solid var(--border);
    background: var(--bg-app);
  }

  /* Sheet Rows */
  .sheet-list { margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
  .sheet-item {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    padding: 12px 16px;
    border-radius: 12px;
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .sheet-item:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--border); }

  .sheet-info { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
  .sheet-icon {
    width: 36px; height: 36px;
    background: var(--accent-light); color: var(--accent);
    border-radius: 8px;
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  .sheet-icon svg { width: 20px; height: 20px; }
  .sheet-text { flex: 1; min-width: 0; }
  .sheet-name {
    font-size: 0.95rem; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;
  }

  .sheet-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .btn {
    padding: 8px 14px; border-radius: 8px;
    font-size: 0.85rem; font-weight: 600;
    cursor: pointer; border: none; text-decoration: none;
    display: inline-flex; align-items: center; gap: 6px;
    transition: all 0.2s ease;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-secondary { background: var(--bg-surface-hover); color: var(--text-main); border: 1px solid var(--border); }
  .btn-secondary:hover { background: var(--border); }

  /* Empty State */
  .empty-state { text-align: center; padding: 24px; color: var(--text-muted); font-size: 0.9rem; }

  /* PDF Modal */
  .pdf-modal {
    position: fixed; inset: 0; z-index: 100;
    background: var(--modal-overlay);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    display: flex; flex-direction: column; justify-content: flex-end;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .pdf-modal.open { opacity: 1; pointer-events: auto; }
  
  .pdf-modal-content {
    background: var(--bg-app);
    height: 92vh; width: 100%; margin: 0 auto;
    border-radius: 20px 20px 0 0;
    display: flex; flex-direction: column;
    transform: translateY(100%);
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: var(--shadow-lg);
  }
  .pdf-modal.open .pdf-modal-content { transform: translateY(0); }
  
  .pdf-modal-content.fullscreen {
    height: 100dvh;
    border-radius: 0;
  }

  .pdf-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 20px;
    background: var(--bg-surface);
    border-radius: inherit;
    border-bottom: 1px solid var(--border);
  }
  .pdf-title { font-weight: 600; font-size: 0.95rem; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60vw; }
  
  .pdf-actions { display: flex; align-items: center; gap: 8px; }
  .btn-icon {
    background: var(--bg-surface-hover); border: none;
    width: 40px; height: 40px; border-radius: 50%;
    display: grid; place-items: center; color: var(--text-main);
    cursor: pointer; transition: background 0.2s ease;
  }
  .btn-icon:hover { background: var(--border); }
  
  .pdf-frame-wrapper { flex: 1; width: 100%; position: relative; background: var(--bg-app); }
  .pdf-frame-wrapper iframe { width: 100%; height: 100%; border: none; position: absolute; inset: 0; }

  /* Skeleton Loading */
  .skeleton-card {
    height: 84px; background: var(--bg-surface);
    border: 1px solid var(--border); border-radius: 16px; margin-bottom: 16px;
    position: relative; overflow: hidden;
  }
  .skeleton-card::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--text-muted) 10%, transparent), transparent);
    animation: shimmer 1.5s infinite;
  }
  @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

  @media (max-width: 640px) {
    .controls-row { flex-direction: column; }
    .filter-pill { padding: 12px 16px; justify-content: center; }
    .sheet-item { flex-direction: column; align-items: stretch; gap: 12px; }
    .sheet-actions { display: grid; grid-template-columns: 1fr 1fr; }
    .btn { justify-content: center; }
    .pdf-modal-content { height: 96dvh; }
  }
</style>
</head>
<body class="subject-physics">

  <!-- Desktop Subtle Background Elements Layer -->
  <div id="desktopBg" class="desktop-bg" aria-hidden="true"></div>

  <!-- Spatial Metadata Bar -->
  <div class="top-meta-bar">
    <span class="mono">HSC · 2ND PAPER</span>
    <span class="mono">Made by Zephyrizz</span>
  </div>

  <!-- Floating Navbar -->
  <div class="navbar-wrapper">
    <nav class="navbar">
      <div class="brand">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
        </div>
        <h1 class="brand-title">Lecture Binder</h1>
      </div>
      <div class="header-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
          <!-- Sun Icon -->
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          <!-- Moon Icon -->
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
      </div>
    </nav>
  </div>

  <main class="container">
    <!-- Subject Switcher -->
    <div class="subject-switcher" role="tablist">
      <button class="subject-tab" data-subject="physics" role="tab" aria-selected="true">
        <span class="bn">পদার্থবিজ্ঞান</span>
        <span class="en-label">Physics</span>
      </button>
      <button class="subject-tab" data-subject="math" role="tab" aria-selected="false">
        <span class="bn">উচ্চতর গণিত</span>
        <span class="en-label">Higher Math</span>
      </button>
    </div>

    <!-- Search & Filter Controls -->
    <div class="controls-row">
      <div class="search-container">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search for a specific lecture or topic..." autocomplete="off">
      </div>
      <button class="filter-pill" id="filterSheetsBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
        With Sheets Only
      </button>
    </div>

    <!-- Chapters Content -->
    <div class="chapters-container" id="panel" role="tabpanel">
      <!-- Injected via JS -->
    </div>
  </main>

  <!-- Fullscreen PDF Modal -->
  <div class="pdf-modal" id="pdfModal">
    <div class="pdf-modal-content">
      <div class="pdf-header">
        <div class="pdf-title" id="viewerTitle">Document Preview</div>
        <div class="pdf-actions">
          <button class="btn-icon" id="fullscreenViewerBtn" aria-label="Toggle Fullscreen">
            <!-- Maximize Icon -->
            <svg id="icon-maximize" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
            </svg>
            <!-- Minimize Icon -->
            <svg id="icon-minimize" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
              <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>
            </svg>
          </button>
          <button class="btn-icon" id="closeViewerBtn" aria-label="Close">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
      </div>
      <div class="pdf-frame-wrapper">
        <iframe id="pdfFrame" src="" title="Document Preview"></iframe>
      </div>
    </div>
  </div>

<script>
(function(){
  "use strict";

  // --- RESTORED: Missing Haptic Function ---
  function triggerHaptic(duration = 30) {
    if ('vibrate' in navigator) {
      try { navigator.vibrate(duration); } catch (e) {}
    }
  }

  function updateBackgroundElements() {
    const bgLayer = document.getElementById("desktopBg");
    if (!bgLayer) return;
    
    const animations = ['doodleFloat1', 'doodleFloat2', 'doodleFloat3'];
    const doodles = DOODLE_ELEMENTS[activeSubject] || [];
    
    bgLayer.classList.remove('ready');
    
    bgLayer.innerHTML = doodles.map(d => {
      const isRight = d.x.startsWith('right:');
      const posX = isRight ? `right: ${d.x.replace('right:', '')}` : `left: ${d.x}`;
      const animName = animations[(d.anim || 1) - 1];
      
      return `<div class="bg-doodle ${d.cls || ''}" style="
        ${posX}; top: ${d.y}; font-size: ${d.size};
        --rot: ${d.rot || '0deg'};
        --doodle-opacity: ${d.opacity || 0.1};
        animation-name: ${animName};
        animation-duration: ${d.dur || 16}s;
        animation-delay: ${d.delay || 0}s;
      ">${d.content}</div>`;
    }).join('');
    
    // Trigger fade-in
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        bgLayer.classList.add('ready');
      });
    });
  }

  function parseCSV(text) {
    const lines = text.trim().split("\n");
    if (lines.length < 2) return [];
    const headers = lines[0].split(",").map(h => h.trim().replace(/^"|"$/g, ''));
    const results = [];
    for (let i = 1; i < lines.length; i++) {
      if (!lines[i].trim()) continue;
      const values = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.trim().replace(/^"|"$/g, ''));
      const obj = {};
      headers.forEach((h, idx) => obj[h] = values[idx] || "");
      results.push(obj);
    }
    return results;
  }

  async function loadDataFromSheets() {
    renderSkeletons();
    const cachedData = localStorage.getItem(CACHE_KEY);
    const cachedTime = localStorage.getItem(CACHE_TIME_KEY);
    const isCacheValid = cachedTime && (Date.now() - parseInt(cachedTime, 10) < CACHE_DURATION);

    if (cachedData && isCacheValid) {
      applyParsedData(JSON.parse(cachedData));
      renderPanel();
      fetchFreshData(); 
      return;
    }
    await fetchFreshData();
  }

  async function fetchFreshData() {
    try {
      const res = await fetch(SHEET_CSV_URL);
      const csvText = await res.text();
      const data = parseCSV(csvText);
      localStorage.setItem(CACHE_KEY, JSON.stringify(data));
      localStorage.setItem(CACHE_TIME_KEY, Date.now().toString());
      applyParsedData(data);
    } catch (e) {
      console.error("Failed to fetch Google Sheets CSV", e);
    } finally {
      renderPanel();
    }
  }

  function applyParsedData(data) {
    SYLLABUS = JSON.parse(JSON.stringify(BASE_SYLLABUS));
    data.forEach(row => {
      const subj = row.Subject ? row.Subject.toLowerCase().trim() : "";
      const chIdx = parseInt(row.ChapterIndex, 10) - 1;
      if (SYLLABUS[subj] && SYLLABUS[subj].chapters[chIdx]) {
        SYLLABUS[subj].chapters[chIdx].sheets.push({ title: row.Title, driveUrl: row.DriveUrl });
      }
    });
  }

  function getPreviewUrl(rawUrl) {
    if (!rawUrl) return "";
    let cleanUrl = rawUrl.match(/https?:\/\/[^\s\)\>\]]+/)?.[0] || rawUrl;
    return cleanUrl.includes('/view') ? cleanUrl.replace(/\/view.*$/, '/preview') : cleanUrl;
  }

    const panel = document.getElementById("panel");

    const query = currentSearchQuery.toLowerCase();
    const fragment = document.createDocumentFragment();

    subj.chapters.forEach((ch, idx) => {
      const code = subj.prefix + "-" + String(idx + 1).padStart(2, "0");
      
      const filteredSheets = ch.sheets.filter(s => s.title.toLowerCase().includes(query));
      const isChapterMatch = ch.bn.includes(query) || ch.en.toLowerCase().includes(query);
      
      if (query && !isChapterMatch && filteredSheets.length === 0) return;
      if (filterSheetsOnly && ch.sheets.length === 0) return;

      const sheetsToRender = query && !isChapterMatch ? filteredSheets : ch.sheets;
      const sheetCount = sheetsToRender.length;

      const details = document.createElement("details");
      details.className = "chapter-card";
      if (query) details.open = true;

      details.innerHTML = `

  function openPdfModal(url, title) {
    pdfFrame.src = url;
    viewerTitle.textContent = title || "Document Preview";
    pdfModal.classList.add("open");
    document.body.style.overflow = "hidden";
  }

  function closePdfModal() {
    pdfModal.classList.remove("open");
    document.body.style.overflow = "";
    setTimeout(() => { 
      pdfFrame.src = ""; 
      if (pdfModalContent.classList.contains("fullscreen")) toggleFullscreen();
    }, 300);
  }
  
  function toggleFullscreen() {
    triggerHaptic(30);
    pdfModalContent.classList.toggle("fullscreen");
    const isFull = pdfModalContent.classList.contains("fullscreen");
    iconMaximize.style.display = isFull ? "none" : "block";
    iconMinimize.style.display = isFull ? "block" : "none";
  }

  });
  
  document.getElementById("fullscreenViewerBtn").addEventListener("click", toggleFullscreen);
  
  pdfModal.addEventListener("click", (e) => {
    if (e.target === pdfModal) closePdfModal();
  });

  // Subject Tabs Logic
  document.querySelectorAll(".subject-tab").forEach(tab => {
    tab.addEventListener("click", () => {
      triggerHaptic(50);
      if (activeSubject === tab.dataset.subject) return;
      activeSubject = tab.dataset.subject;
      document.querySelectorAll(".subject-tab").forEach(t => t.setAttribute("aria-selected", t === tab ? "true" : "false"));
      document.getElementById("searchInput").value = "";
      currentSearchQuery = "";
      renderPanel();
    });
  });

  // Theme Logic
  const THEME_KEY = "lecture_binder_theme";
  const themeToggleBtn = document.getElementById("themeToggle");
  const metaThemeColor = document.getElementById("metaThemeColor");

  function syncMetaThemeColor(theme) {
    metaThemeColor.setAttribute("content", theme === "dark" ? "#0f172a" : "#f8fafc");
  }

  function applyTheme(theme) {
    if (theme === "dark") document.documentElement.setAttribute("data-theme", "dark");
    else document.documentElement.removeAttribute("data-theme");
    syncMetaThemeColor(theme);
  }

  function getCurrentTheme() {
    return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
  }

  themeToggleBtn.addEventListener("click", () => {
    triggerHaptic(30);
    const next = getCurrentTheme() === "dark" ? "light" : "dark";
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch(e) {}
  });

  applyTheme(getCurrentTheme());
  loadDataFromSheets();

})();
</script>
</body>
</html>
