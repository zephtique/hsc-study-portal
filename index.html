<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSC 2nd Paper Learning Portal</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar Navigation */
        .sidebar { width: 320px; background-color: #0b1120; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .brand { padding: 20px; font-size: 1.1rem; font-weight: 700; color: var(--accent); border-bottom: 1px solid var(--border); }
        .subject-tabs { display: flex; background-color: var(--card-bg); }
        .tab-btn { flex: 1; padding: 14px; background: none; border: none; color: var(--text-muted); font-weight: 600; cursor: pointer; }
        .tab-btn.active { color: var(--accent); border-bottom: 3px solid var(--accent); background-color: rgba(56, 189, 248, 0.05); }
        .chapter-list { flex: 1; overflow-y: auto; padding: 12px; }
        .chapter-item { padding: 12px 16px; margin-bottom: 8px; background-color: var(--card-bg); border-radius: 8px; cursor: pointer; border: 1px solid transparent; font-size: 0.9rem; transition: all 0.2s; }
        .chapter-item:hover { border-color: var(--accent); }
        .chapter-item.active { background-color: var(--primary); color: #fff; font-weight: 600; }

        /* Main Display Area */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .header { padding: 20px 32px; background-color: var(--card-bg); border-bottom: 1px solid var(--border); }
        .header h1 { font-size: 1.4rem; color: var(--text-light); }
        .header p { color: var(--text-muted); font-size: 0.85rem; }

        .content-body { padding: 24px; flex: 1; display: flex; flex-direction: column; gap: 20px; }
        .sheet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        .sheet-card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; display: flex; justify-content: space-between; align-items: center; }
        .sheet-card.selected { border-color: var(--accent); background-color: #273549; }
        
        .btn-group { display: flex; gap: 8px; }
        .view-btn { padding: 6px 12px; background-color: var(--primary); color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem; text-decoration: none; }
        .drive-btn { padding: 6px 12px; background-color: transparent; border: 1px solid var(--border); color: var(--text-muted); border-radius: 4px; cursor: pointer; font-size: 0.85rem; text-decoration: none; }
        .drive-btn:hover { border-color: var(--accent); color: var(--text-light); }

        /* PDF Embedded Viewer */
        .pdf-viewer-container { width: 100%; flex: 1; min-height: 550px; background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border); overflow: hidden; display: none; }
        iframe { width: 100%; height: 100%; border: none; }
        
        .empty-state { color: var(--text-muted); padding: 20px 0; }
    </style>
</head>
<body>

    <!-- Sidebar Component -->
    <div class="sidebar">
        <div class="brand">HSC 2nd Paper Portal</div>
        <div class="subject-tabs">
            <button class="tab-btn active" onclick="switchSubject('physics')">Physics</button>
            <button class="tab-btn" onclick="switchSubject('math')">Higher Math</button>
        </div>
        <div class="chapter-list" id="chapterList"></div>
    </div>

    <!-- Main Section View -->
    <div class="main-content">
        <div class="header">
            <h1 id="chapterTitle">Select a Chapter</h1>
            <p id="subjectSubtitle">HSC Bangladesh Curriculum</p>
        </div>

        <div class="content-body">
            <div class="sheet-grid" id="sheetContainer"></div>
            
            <!-- Embedded PDF Reader -->
            <div class="pdf-viewer-container" id="viewerContainer">
                <iframe id="pdfFrame" src=""></iframe>
            </div>
        </div>
    </div>

    <script>
        // Data Structure populated with provided Google Drive Links
        const syllabusData = {
            physics: {
                title: "Physics 2nd Paper",
                chapters: [
                    { name: "Chapter 1: Thermodynamics", sheets: [] },
                    { 
                        name: "Chapter 2: Static Electricity", 
                        sheets: [
                            { title: "Lecture Sheet 01", driveUrl: "https://drive.google.com/file/d/1JDuoHBS6b5y0oZuq6jps8RwYQ7B1R-da/view?usp=drive_link" },
                            { title: "Lecture Sheet 02", driveUrl: "https://drive.google.com/file/d/1bwyPK_hvElaHUdFy8nJNSaJd8aq9f888/view?usp=drive_link" }
                        ] 
                    },
                    { 
                        name: "Chapter 3: Current Electricity", 
                        sheets: [
                            { title: "Lecture Sheet 01", driveUrl: "https://drive.google.com/file/d/1V-8cvWdRdJh9-5Kf1xWzjZT26k1RqgcA/view?usp=drive_link" }
                        ] 
                    },
                    { name: "Chapter 4: Magnetism", sheets: [] },
                    { name: "Chapter 5: Electromagnetic Induction", sheets: [] },
                    { name: "Chapter 6: Geometrical Optics", sheets: [] },
                    { name: "Chapter 7: Physical Optics", sheets: [] },
                    { name: "Chapter 8: Modern Physics", sheets: [] },
                    { name: "Chapter 9: Atomic Model & Nuclear Physics", sheets: [] },
                    { name: "Chapter 10: Semiconductor & Electronics", sheets: [] }
                ]
            },
            math: {
                title: "Higher Mathematics 2nd Paper",
                chapters: [
                    { name: "Chapter 1: Real Numbers & Inequalities", sheets: [] },
                    { name: "Chapter 2: Linear Programming", sheets: [] },
                    { 
                        name: "Chapter 3: Complex Numbers", 
                        sheets: [
                            { title: "Lecture Sheet 01", driveUrl: "https://drive.google.com/file/d/1ek7dyI8YmmmzbCKl03JhEQOUpPGN_HLX/view?usp=drive_link" },
                            { title: "Lecture Sheet 02", driveUrl: "https://drive.google.com/file/d/1BcPZehlleVXHRnc_FI41F4iqK6TcEmni/view?usp=drive_link" },
                            { title: "Lecture Sheet 03", driveUrl: "https://drive.google.com/file/d/1uc-5VSF-09v-_xRhvcGi7_4jbeSdAHXb/view?usp=drive_link" },
                            { title: "Lecture Sheet 04", driveUrl: "https://drive.google.com/file/d/1ATm65RnAlzMaVBRmTGickYEUJ0Kg2WUP/view?usp=drive_link" }
                        ] 
                    },
                    { 
                        name: "Chapter 4: Polynomials", 
                        sheets: [
                            { title: "Lecture Sheet 01", driveUrl: "https://drive.google.com/file/d/1itCazyOst6T0BH-oBQyEJ89LQtVEFigk/view?usp=drive_link" },
                            { title: "Lecture Sheet 02", driveUrl: "https://drive.google.com/file/d/1Jy1VcarefYz00eN05MijVKSBIh64cHTp/view?usp=drive_link" },
                            { title: "Lecture Sheet 03", driveUrl: "https://drive.google.com/file/d/162nuOiFh80Wj9UMcJrcSbfPddTvINFV-/view?usp=drive_link" },
                            { title: "Lecture Sheet 04", driveUrl: "https://drive.google.com/file/d/1jttHsuX84puwS7umVkfFAF2DKceJ5L7k/view?usp=drive_link" }
                        ] 
                    },
                    { 
                        name: "Chapter 5: Binomial Expansion", 
                        sheets: [
                            { title: "Lecture Sheet 01", driveUrl: "https://drive.google.com/file/d/19LXGfJG4pbj0qw29YUd9cYJBzIiQgoMb/view?usp=drive_link" },
                            { title: "Lecture Sheet 02", driveUrl: "https://drive.google.com/file/d/11tWwmpsCVC0ztK7NO3Dg-0yV_MscWFyP/view?usp=drive_link" }
                        ] 
                    },
                    { name: "Chapter 6: Conics", sheets: [] },
                    { name: "Chapter 7: Inverse Trigonometric Functions", sheets: [] },
                    { name: "Chapter 8: Statics", sheets: [] },
                    { name: "Chapter 9: Motion of Particles", sheets: [] },
                    { name: "Chapter 10: Probability", sheets: [] }
                ]
            }
        };

        let currentSubject = 'physics';
        let activeChapterIndex = 1; // Default to Chapter 2 (Static Electricity)

        // Helper function to format Google Drive link for embedded previewing
        function getPreviewUrl(rawUrl) {
            if (rawUrl.includes('/view')) {
                return rawUrl.replace(/\/view.*$/, '/preview');
            }
            return rawUrl;
        }

        function switchSubject(subjectKey) {
            currentSubject = subjectKey;
            // Pick default chapter with contents, or fallback to first
            if (subjectKey === 'physics') activeChapterIndex = 1;
            else activeChapterIndex = 2;

            document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', (idx === 0 && subjectKey === 'physics') || (idx === 1 && subjectKey === 'math'));
            });
            renderChapters();
            renderContent();
        }

        function renderChapters() {
            const listContainer = document.getElementById('chapterList');
            listContainer.innerHTML = '';
            syllabusData[currentSubject].chapters.forEach((chapter, index) => {
                const item = document.createElement('div');
                item.className = `chapter-item ${index === activeChapterIndex ? 'active' : ''}`;
                
                // Add indicator dot if chapter has attached sheets
                const count = chapter.sheets.length;
                item.innerText = count > 0 ? `${chapter.name} (${count})` : chapter.name;
                
                item.onclick = () => {
                    activeChapterIndex = index;
                    renderChapters();
                    renderContent();
                };
                listContainer.appendChild(item);
            });
        }

        function renderContent() {
            const chapterObj = syllabusData[currentSubject].chapters[activeChapterIndex];
            document.getElementById('chapterTitle').innerText = chapterObj.name;
            document.getElementById('subjectSubtitle').innerText = syllabusData[currentSubject].title;
            
            const container = document.getElementById('sheetContainer');
            const viewer = document.getElementById('viewerContainer');
            viewer.style.display = 'none'; // Hide viewer until requested
            
            container.innerHTML = '';

            if (!chapterObj.sheets || chapterObj.sheets.length === 0) {
                container.innerHTML = '<div class="empty-state">No lecture sheets attached to this chapter yet.</div>';
                return;
            }

            chapterObj.sheets.forEach((sheet) => {
                const previewUrl = getPreviewUrl(sheet.driveUrl);
                const card = document.createElement('div');
                card.className = 'sheet-card';
                card.innerHTML = `
                    <div><strong>${sheet.title}</strong></div>
                    <div class="btn-group">
                        <button class="view-btn" onclick="loadPDF('${previewUrl}', this)">Read PDF</button>
                        <a href="${sheet.driveUrl}" target="_blank" class="drive-btn">Open Drive</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function loadPDF(url, btnElement) {
            const viewer = document.getElementById('viewerContainer');
            const frame = document.getElementById('pdfFrame');
            
            // Highlight active sheet card
            document.querySelectorAll('.sheet-card').forEach(c => c.classList.remove('selected'));
            btnElement.closest('.sheet-card').classList.add('selected');

            frame.src = url;
            viewer.style.display = 'block';
            viewer.scrollIntoView({ behavior: 'smooth' });
        }

        // Initial App Load
        renderChapters();
        renderContent();
    </script>
</body>
</html>
