<script>
  (function(){
    try {
      var stored = localStorage.getItem("lecture_binder_theme");
      var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      if (theme === "dark") document.documentElement.setAttribute("data-theme", "dark");
    } catch(e) {}
  })();
</script>

<style>
  :root{
    --paper: #F1EEE4;
    --surface: #FBFAF6;
    --line: #DBD5C3;
    --ink: #1E2420;
    --muted: #736F5F;
    --physics: #1F6F78;
    --physics-dark: #154F56;
    --physics-tint: #E4EFEE;
    --math: #B4791F;
    --math-dark: #8A5B14;
    --math-tint: #F5EBD8;
    --accent: var(--physics);
    --accent-dark: var(--physics-dark);
    --accent-tint: var(--physics-tint);
    --shadow-soft: rgba(0,0,0,0.02);
    --skeleton-op-a: 0.6;
    --skeleton-op-b: 0.3;
  }

  html[data-theme="dark"]{
    --paper: #14181A;
    --surface: #1B2022;
    --line: #2C3336;
    --ink: #EAE7DC;
    --muted: #8B9294;
    --physics: #3FA5AE;
    --physics-dark: #2A7F87;
    --physics-tint: #1C3335;
    --math: #E0A748;
    --math-dark: #B4791F;
    --math-tint: #35291A;
    --shadow-soft: rgba(0,0,0,0.25);
    --skeleton-op-a: 0.35;
    --skeleton-op-b: 0.18;
  }

  html{ transition: background-color .35s ease; }
  html[data-theme="dark"] .sheet-icon{
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 22%, var(--surface));
  }
  html[data-theme="dark"] .btn-read{ color: #14181A; }
  html[data-theme="dark"] .site-logo path[fill="#FBFAF6"]{ fill: var(--surface); }
  html[data-theme="dark"] .pdf-viewer-container{ box-shadow: 0 4px 16px var(--shadow-soft); }

  *{ box-sizing: border-box; }
  html{ -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body{
    margin:0;
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans", "Noto Sans Bengali", sans-serif;
    line-height: 1.5;
    transition: background-color .35s ease, color .35s ease;
  }
  header.site, main.panel, .subject-tab, .sheet-row, .sheet-icon, .chapter-code,
  .pdf-viewer-container, .pdf-viewer-header, .btn-drive, .skeleton-item, details.chapter{
    transition: background-color .3s ease, border-color .3s ease, color .3s ease, box-shadow .3s ease;
  }
  .bn{ font-family: "Noto Serif Bengali", "IBM Plex Sans", serif; }
  .mono{ font-family: "IBM Plex Mono", monospace; letter-spacing: .02em; }

  a{ color: inherit; }
  button{ font: inherit; color: inherit; }

  :focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }

  .wrap{ max-width: 880px; margin: 0 auto; padding: 0 20px 80px; }

  header.site{
    padding: 40px 0 0px;
    background-image:
      linear-gradient(var(--paper), var(--paper)),
      repeating-linear-gradient(0deg, color-mix(in srgb, var(--accent) 10%, transparent) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, color-mix(in srgb, var(--accent) 10%, transparent) 0 1px, transparent 1px 28px);
    transition: background .3s ease;
  }
  header.site .wrap{ padding-bottom: 0; }
  .header-top{ display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; gap: 12px; }
  .eyebrow{ font-size: .8rem; color: var(--muted); margin: 0; }
  .header-top-right{ display: flex; align-items: center; gap: 10px; }
  .credit-top{ font-size: .74rem; color: var(--muted); opacity: 0.7; }

  .theme-toggle{
    position: relative; flex: 0 0 auto; width: 38px; height: 38px;
    border-radius: 50%; border: 1px solid var(--line); background: var(--surface);
    cursor: pointer; display: grid; place-items: center; overflow: hidden;
    transition: background-color .3s ease, border-color .3s ease, transform .15s ease;
  }
  .theme-toggle:hover{ border-color: var(--accent); transform: scale(1.05); }
  .theme-toggle:active{ transform: scale(0.92); }
  .theme-toggle svg{
    position: absolute; width: 19px; height: 19px;
    transition: transform .45s cubic-bezier(.65,-0.15,.35,1.15), opacity .3s ease;
  }
  .theme-toggle .icon-sun{ color: var(--math); }
  .theme-toggle .icon-moon{ color: var(--physics); }

  /* Light mode: sun visible, moon hidden below */
  html:not([data-theme="dark"]) .theme-toggle .icon-sun{ opacity: 1; transform: rotate(0deg) scale(1); }
  html:not([data-theme="dark"]) .theme-toggle .icon-moon{ opacity: 0; transform: rotate(90deg) scale(.4); }

  /* Dark mode: moon visible, sun hidden above */
  html[data-theme="dark"] .theme-toggle .icon-sun{ opacity: 0; transform: rotate(-90deg) scale(.4); }
  html[data-theme="dark"] .theme-toggle .icon-moon{ opacity: 1; transform: rotate(0deg) scale(1); }
  
  .title-group{ display: flex; align-items: center; gap: 12px; }
  .site-logo{ width: 36px; height: 36px; border-radius: 8px; flex-shrink: 0; transition: transform .2s ease; }
  .site-logo:hover{ transform: scale(1.05); }
  h1.site-title{ margin: 0; font-size: clamp(2rem, 5vw, 2.6rem); font-weight: 700; letter-spacing: -.01em; }

  nav.subjects{ display: flex; gap: 10px; margin-top: 20px; }
  .subject-tab{
    flex: 1 1 0; cursor: pointer; background: var(--surface);
    border: 1px solid var(--line); border-bottom: none;
    border-radius: 12px 12px 0 0; padding: 16px 18px 14px;
    text-align: left; position: relative; top: 1px;
    transition: transform .15s ease, background .2s ease, border-color .2s ease;
  }
  .subject-tab .name-bn{ display:block; font-size: 1.15rem; font-weight: 600; }
  .subject-tab .name-en{ display:block; font-size: .78rem; color: var(--muted); margin-top: 2px; }
  .subject-tab .count{ display:block; margin-top: 10px; font-size: .74rem; color: var(--muted); }
  .subject-tab[data-subject="physics"] .count-dot{ background: var(--physics); }
  .subject-tab[data-subject="math"] .count-dot{ background: var(--math); }
  .count-dot{ display:inline-block; width:6px; height:6px; border-radius: 50%; margin-right: 6px; }
  .subject-tab[aria-selected="true"]{
    background: var(--surface); border-color: var(--accent);
    box-shadow: 0 -2px 0 var(--accent) inset; transform: translateY(-2px);
  }
  .subject-tab[aria-selected="true"] .name-bn{ color: var(--accent-dark); }
  .subject-tab:not([aria-selected="true"]):hover{ background: var(--paper); }

  main.panel{ 
    background: var(--surface); 
    border: 1px solid var(--line); 
    border-radius: 0 10px 10px 10px; 
    padding: 8px;
    min-height: 200px;
    transition: opacity .2s ease;
  }

  details.chapter{ border-bottom: 1px solid var(--line); }
  details.chapter:last-child{ border-bottom: none; }

  summary.chapter-head{
    list-style: none; cursor: pointer; display: flex; align-items: center;
    gap: 16px; padding: 16px 12px; border-radius: 8px;
    transition: background .15s ease;
  }
  summary.chapter-head::-webkit-details-marker{ display:none; }
  summary.chapter-head:hover{ background: var(--paper); }

  .chapter-code{
    flex: 0 0 auto; font-size: .72rem; color: var(--accent-dark);
    background: var(--accent-tint); padding: 4px 8px; border-radius: 6px;
    min-width: 52px; text-align: center;
  }
  .chapter-titles{ flex: 1 1 auto; min-width: 0; }
  .chapter-name-bn{ font-size: 1.05rem; font-weight: 600; display: block; }
  .chapter-name-en{ font-size: .8rem; color: var(--muted); display: block; margin-top: 1px; }
  .chapter-meta{ flex: 0 0 auto; font-size: .76rem; color: var(--muted); text-align: right; white-space: nowrap; }
  .chapter-chevron{ flex: 0 0 auto; width: 20px; height: 20px; display: grid; place-items: center; transition: transform .2s ease; color: var(--muted); }
  details[open] .chapter-chevron{ transform: rotate(90deg); }

  .chapter-body{ padding: 12px; }

  .sheet-list{ display: flex; flex-direction: column; gap: 8px; }
  .sheet-empty{ font-size: .88rem; color: var(--muted); padding: 4px 0; }
  .sheet-row{
    display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--paper);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
    text-decoration: none; transition: border-color .15s ease, box-shadow .15s ease;
  }
  .sheet-info-group{ display: flex; align-items: center; gap: 10px; min-width: 0; }
  .sheet-icon{
    flex: 0 0 auto; width: 30px; height: 30px; border-radius: 6px;
    background: var(--accent-tint); color: var(--accent-dark);
    display: grid; place-items: center; font-size: .68rem; font-weight: 600;
  }
  .sheet-info{ flex: 1 1 auto; min-width: 0; }
  .sheet-name{ font-size: .88rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sheet-sub{ font-size: .74rem; color: var(--muted); }
  .sheet-row:hover{ border-color: var(--accent); box-shadow: 0 2px 6px var(--shadow-soft); }
  .sheet-row:hover .sheet-name{ color: var(--accent-dark); }

  .sheet-actions{ display: flex; gap: 8px; flex: 0 0 auto; }
  .btn-read{
    background: var(--accent); color: #fff; border: none; padding: 6px 12px;
    border-radius: 6px; font-size: .78rem; font-weight: 500; cursor: pointer;
    transition: background .15s ease, transform .1s ease;
  }
  .btn-read:hover{ background: var(--accent-dark); }
  .btn-read:active{ transform: scale(0.97); }
  .btn-drive{
    background: transparent; border: 1px solid var(--line); color: var(--muted);
    padding: 6px 12px; border-radius: 6px; font-size: .78rem; text-decoration: none;
    transition: border-color .15s ease, color .15s ease;
  }
  .btn-drive:hover{ border-color: var(--accent); color: var(--accent-dark); }

  /* PDF Viewer Frame */
  .pdf-viewer-container{
    margin-top: 20px; width: 100%; height: 550px; background: var(--paper);
    border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: none;
    box-shadow: 0 4px 12px var(--shadow-soft); position: relative;
  }
  .pdf-viewer-header{
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--line);
    font-size: .8rem; color: var(--muted);
  }
  .pdf-viewer-close{
    background: none; border: none; cursor: pointer; color: var(--muted);
    font-weight: 600; font-size: .8rem; padding: 4px 8px; border-radius: 4px;
  }
  .pdf-viewer-close:hover{ background: var(--paper); color: var(--ink); }
  .pdf-viewer-container iframe{ width: 100%; height: calc(100% - 37px); border: none; }

  /* Skeleton Loading Styles */
  .skeleton-item{
    height: 52px; background: var(--paper); margin: 8px 0; border-radius: 8px;
    animation: skeleton-pulse 1.2s infinite ease-in-out;
  }
  @keyframes skeleton-pulse {
    0% { opacity: var(--skeleton-op-a); }
    50% { opacity: var(--skeleton-op-b); }
    100% { opacity: var(--skeleton-op-a); }
  }

  footer.note{ margin-top: 28px; font-size: .78rem; color: var(--muted); max-width: 62ch; }

  @media (max-width: 560px){
    .chapter-body{ padding: 8px; }
    .chapter-meta{ display: none; }
    nav.subjects{ gap: 6px; }
    .subject-tab{ padding: 12px 12px 10px; }
    .sheet-row{ flex-direction: column; align-items: flex-start; }
    .sheet-actions{ width: 100%; }
    .btn-read, .btn-drive{ flex: 1; text-align: center; }
    .pdf-viewer-container{ height: 450px; }
  }
</style>
</head>

<script>
(function(){
  "use strict";

  // Register Service Worker for PWA
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(err => {
        console.error('ServiceWorker registration failed: ', err);
      });
    });
  }

  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQLFwSjs3po1TpI0XSsjBeJtYf_g9j81XSAxz_L6gh6xsamgt3Zy6KXTqQvApFKHtL59mFxrlGOAsuC/pub?output=csv";
  const CACHE_KEY = "lecture_binder_data_v1";
  const CACHE_TIME_KEY = "lecture_binder_time_v1";
  const CACHE_DURATION = 10 * 60 * 1000; // 10 minutes cache

  const BASE_SYLLABUS = {
    physics: {
      label: "পদার্থবিজ্ঞান", labelEn: "Physics", prefix: "PH",
      chapters: [
        { bn: "তাপগতিবিদ্যা", en: "Thermodynamics", sheets: [] },
        { bn: "স্থির তড়িৎ", en: "Electrostatics", sheets: [] },
        { bn: "চল তড়িৎ", en: "Current Electricity", sheets: [] },
        { bn: "তড়িৎ প্রবাহের চৌম্বক ক্রিয়া ও চুম্বকত্ব", en: "Magnetic Effect of Current & Magnetism", sheets: [] },
        { bn: "তড়িৎ চুম্বকীয় আবেশ ও পরিবর্তী প্রবাহ", en: "Electromagnetic Induction & Alternating Current", sheets: [] },
        { bn: "জ্যামিতিক আলোকবিজ্ঞান", en: "Geometrical Optics", sheets: [] },
        { bn: "ভৌত আলোকবিজ্ঞান", en: "Physical Optics", sheets: [] },
        { bn: "আধুনিক পদার্থবিজ্ঞানের সূচনা", en: "Introduction to Modern Physics", sheets: [] },
        { bn: "পরমাণুর মডেল ও নিউক্লিয়ার পদার্থবিজ্ঞান", en: "Atomic Model & Nuclear Physics", sheets: [] },
        { bn: "সেমিকন্ডাক্টর ও ইলেকট্রনিক্স", en: "Semiconductor & Electronics", sheets: [] }
      ]
    },
    math: {
      label: "উচ্চতর গণিত", labelEn: "Higher Math", prefix: "HM",
      chapters: [
        { bn: "বাস্তব সংখ্যা ও অসমতা", en: "Real Numbers & Inequalities", sheets: [] },
        { bn: "যোগাশ্রয়ী প্রোগ্রাম", en: "Linear Programming", sheets: [] },
        { bn: "জটিল সংখ্যা", en: "Complex Numbers", sheets: [] },
        { bn: "বহুপদী ও বহুপদী সমীকরণ", en: "Polynomials & Polynomial Equations", sheets: [] },
        { bn: "দ্বিপদী বিস্তৃতি", en: "Binomial Expansion", sheets: [] },
        { bn: "কণিক", en: "Conics", sheets: [] },
        { bn: "বিপরীত ত্রিকোণমিতিক ফাংশন ও ত্রিকোণমিতিক সমীকরণ", en: "Inverse Trig Functions & Trig Equations", sheets: [] },
        { bn: "স্থিতিবিদ্যা", en: "Statics", sheets: [] },
        { bn: "সমতলে বস্তুকণার গতি", en: "Motion of Particles in a Plane", sheets: [] },
        { bn: "সম্ভাবনা", en: "Probability", sheets: [] }
      ]
    }
  };

  let SYLLABUS = JSON.parse(JSON.stringify(BASE_SYLLABUS));
  let activeSubject = "physics";
  let currentActivePreviewUrl = "";

  function renderSkeletons() {
    const panel = document.getElementById("panel");
    panel.innerHTML = Array(5).fill('<div class="skeleton-item"></div>').join('');
  }

  function parseCSV(text) {
    const lines = text.trim().split("\n");
    if (lines.length < 2) return [];
    const headers = lines[0].split(",").map(h => h.trim().replace(/^"|"$/g, ''));
    const results = [];
    
    for (let i = 1; i < lines.length; i++) {
      if (!lines[i].trim()) continue;
      const values = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.trim().replace(/^"|"$/g, ''));
      const obj = {};
      headers.forEach((h, idx) => obj[h] = values[idx] || "");
      results.push(obj);
    }
    return results;
  }

  async function loadDataFromSheets() {
    renderSkeletons();

    const cachedData = localStorage.getItem(CACHE_KEY);
    const cachedTime = localStorage.getItem(CACHE_TIME_KEY);
    const isCacheValid = cachedTime && (Date.now() - parseInt(cachedTime, 10) < CACHE_DURATION);

    if (cachedData && isCacheValid) {
      applyParsedData(JSON.parse(cachedData));
      renderPanel();
      fetchFreshData();
      return;
    }

    await fetchFreshData();
  }

  async function fetchFreshData() {
    try {
      const res = await fetch(SHEET_CSV_URL);
      const csvText = await res.text();
      const data = parseCSV(csvText);

      localStorage.setItem(CACHE_KEY, JSON.stringify(data));
      localStorage.setItem(CACHE_TIME_KEY, Date.now().toString());

      applyParsedData(data);
    } catch (e) {
      console.error("Failed to load Google Sheets data", e);
    } finally {
      renderPanel();
    }
  }

  function applyParsedData(data) {
    SYLLABUS = JSON.parse(JSON.stringify(BASE_SYLLABUS));
    data.forEach(row => {
      const subj = row.Subject ? row.Subject.toLowerCase().trim() : "";
      const chIdx = parseInt(row.ChapterIndex, 10) - 1;
      
      if (SYLLABUS[subj] && SYLLABUS[subj].chapters[chIdx]) {
        SYLLABUS[subj].chapters[chIdx].sheets.push({
          title: row.Title,
          driveUrl: row.DriveUrl
        });
      }
    });
  }

  function getPreviewUrl(rawUrl) {
    if (!rawUrl) return "";
    let cleanUrl = rawUrl;
    const match = rawUrl.match(/https?:\/\/[^\s\)\>\]]+/);
    if (match) {
      cleanUrl = match[0];
    }
    if (cleanUrl.includes('/view')) {
      return cleanUrl.replace(/\/view.*$/, '/preview');
    }
    return cleanUrl;
  }

  function updateTabCounts() {
    document.querySelectorAll(".subject-tab").forEach(tab => {
      const subj = tab.dataset.subject;
      const totalCh = SYLLABUS[subj].chapters.length;
      let sheetTotal = 0;
      SYLLABUS[subj].chapters.forEach(c => { sheetTotal += c.sheets.length; });
      const label = sheetTotal > 0
        ? totalCh + " chapters · " + sheetTotal + " sheet" + (sheetTotal === 1 ? "" : "s")
        : totalCh + " chapters";
      tab.querySelector('[data-role="count"]').textContent = label;
    });
  }

  function renderPanel() {
    document.body.className = "subject-" + activeSubject;
    document.documentElement.style.setProperty("--accent", "var(--" + activeSubject + ")");
    document.documentElement.style.setProperty("--accent-dark", "var(--" + activeSubject + "-dark)");
    document.documentElement.style.setProperty("--accent-tint", "var(--" + activeSubject + "-tint)");

    const subj = SYLLABUS[activeSubject];
    const panel = document.getElementById("panel");
    panel.innerHTML = "";

    const fragment = document.createDocumentFragment();

    subj.chapters.forEach((ch, idx) => {
      const code = subj.prefix + "-" + String(idx + 1).padStart(2, "0");
      const sheetCount = ch.sheets.length;

      const details = document.createElement("details");
      details.className = "chapter";

      const summary = document.createElement("summary");
      summary.className = "chapter-head";
      summary.innerHTML = `
        <span class="chapter-code mono">${code}</span>
        <span class="chapter-titles">
          <span class="chapter-name-bn bn">${ch.bn}</span>
          <span class="chapter-name-en">${ch.en}</span>
        </span>
        <span class="chapter-meta mono">${sheetCount > 0 ? sheetCount + " sheet" + (sheetCount === 1 ? "" : "s") : "empty"}</span>
        <span class="chapter-chevron">›</span>
      `;
      details.appendChild(summary);

      const body = document.createElement("div");
      body.className = "chapter-body";

      const list = document.createElement("div");
      list.className = "sheet-list";

      if (sheetCount === 0) {
        list.innerHTML = `<div class="sheet-empty bn">এখনও কোনো লেকচার শীট নেই।</div>`;
      } else {
        ch.sheets.forEach(s => {
          const previewUrl = getPreviewUrl(s.driveUrl);
          const row = document.createElement("div");
          row.className = "sheet-row";
          
          const infoGroup = document.createElement("div");
          infoGroup.className = "sheet-info-group";
          infoGroup.innerHTML = `
            <span class="sheet-icon">PDF</span>
            <span class="sheet-info">
              <span class="sheet-name">${s.title}</span>
              <span class="sheet-sub">Google Drive Document</span>
            </span>
          `;

          const actions = document.createElement("div");
          actions.className = "sheet-actions";

          const readBtn = document.createElement("button");
          readBtn.type = "button";
          readBtn.className = "btn-read";
          readBtn.textContent = "Read PDF";
          readBtn.addEventListener("click", () => togglePdfViewer(previewUrl, s.title));

          const driveLink = document.createElement("a");
          driveLink.href = s.driveUrl;
          driveLink.target = "_blank";
          driveLink.rel = "noopener";
          driveLink.className = "btn-drive";
          driveLink.textContent = "Open Drive";

          actions.appendChild(readBtn);
          actions.appendChild(driveLink);

          row.appendChild(infoGroup);
          row.appendChild(actions);
          list.appendChild(row);
        });
      }

      body.appendChild(list);
      details.appendChild(body);
      fragment.appendChild(details);
    });

    panel.appendChild(fragment);
    updateTabCounts();
  }

  function togglePdfViewer(previewUrl, title) {
    const viewer = document.getElementById("viewerContainer");
    const frame = document.getElementById("pdfFrame");
    const viewerTitle = document.getElementById("viewerTitle");

    if (viewer.style.display === "block" && currentActivePreviewUrl === previewUrl) {
      closePdfViewer();
      return;
    }

    currentActivePreviewUrl = previewUrl;
    frame.src = previewUrl;
    viewerTitle.textContent = title ? "Viewing: " + title : "PDF Preview";
    viewer.style.display = "block";
    viewer.scrollIntoView({ behavior: "smooth" });
  }

  function closePdfViewer() {
    const viewer = document.getElementById("viewerContainer");
    const frame = document.getElementById("pdfFrame");
    viewer.style.display = "none";
    frame.src = "";
    currentActivePreviewUrl = "";
  }

  // Dark mode toggle
  const THEME_KEY = "lecture_binder_theme";
  const themeToggleBtn = document.getElementById("themeToggle");
  const metaThemeColor = document.getElementById("metaThemeColor");

  function getPanelBg() {
    return getComputedStyle(document.documentElement).getPropertyValue("--paper").trim();
  }

  function syncMetaThemeColor() {
    if (metaThemeColor) metaThemeColor.setAttribute("content", getPanelBg());
  }

  function applyTheme(theme) {
    if (theme === "dark") {
      document.documentElement.setAttribute("data-theme", "dark");
    } else {
      document.documentElement.removeAttribute("data-theme");
    }
    themeToggleBtn.setAttribute("aria-pressed", theme === "dark" ? "true" : "false");
    syncMetaThemeColor();
  }

  function getCurrentTheme() {
    return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
  }

  applyTheme(getCurrentTheme());

  themeToggleBtn.addEventListener("click", () => {
    const next = getCurrentTheme() === "dark" ? "light" : "dark";
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch(e) {}
  });

  document.getElementById("closeViewerBtn").addEventListener("click", closePdfViewer);

  document.querySelectorAll(".subject-tab").forEach(tab => {
    tab.addEventListener("click", () => {
      if (activeSubject === tab.dataset.subject) return;
      activeSubject = tab.dataset.subject;
      document.querySelectorAll(".subject-tab").forEach(t => t.setAttribute("aria-selected", t === tab ? "true" : "false"));
      closePdfViewer();
      renderPanel();
    });
  });

  loadDataFromSheets();
})();
</script>
</body>
</html>
